name: EPS 48A2 and safety regression

on:
  pull_request:
    branches: [dev]
  push:
    branches: [codex/honda-eps48a2-startup, codex/honda-eps48a2-onroad]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pycapnp==2.1.0 pycryptodome cffi zstandard tqdm ruff gcovr comma-deps-gcc-arm-none-eabi==13.2.1.post103
      - name: Check bundled Panda application
        run: python panda/scripts/build_eps48a2.py --check
      - name: Reproduce bundled Panda application from source
        run: |
          python panda/scripts/build_eps48a2.py --build --check
          git diff --exit-code -- panda/board/obj/panda_h7.bin.signed panda/board/obj/panda_h7/main.bin docs/EPS_48A2_FIRMWARE.json
      - name: Diagnostic transport and rlog serialization
        run: python -m unittest openpilot.selfdrive.car.tests.test_eps48a2
      - name: Production Panda safety-mode OBD routing
        run: python panda/tests/safety/test_eps48a2_routing.py
      - name: Complete safety suite with UBSan
        run: python -m unittest discover -s opendbc_repo/opendbc/safety/tests
      - name: Complete safety suite with coverage instrumentation
        env:
          SAFETY_COVERAGE: '1'
        run: python -m unittest discover -s opendbc_repo/opendbc/safety/tests
      - name: Enforce complete safety line coverage
        working-directory: opendbc_repo/opendbc/safety/tests
        run: gcovr -r ../ --gcov-executable gcov --fail-under-line=100 -e '^libsafety'
